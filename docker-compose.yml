version: '3.8'

services:
  terraform-frontend:
      build:
        context: ./T1_front
        dockerfile: Dockerfile
      container_name: terraform-frontend
      ports:
        - "3000:3000"
      depends_on:
        - terraform-server
      networks:
        - terraform-network
      restart: unless-stopped

  terraform-server:
    build: ./T1_back
    container_name: terraform-main-server
    ports:
      - "8000:5000"
    volumes:
      - ./T1_back/plugins:/app/plugins
      - ./T1_back/data:/app/data
    environment:
      - PYTHONPATH=/app
    working_dir: /app
    command: python main.py
    restart: unless-stopped
    networks:
      - terraform-network

  error-aggregator:
    build: ./T1_back
    ports:
      - "50051:50051"
    volumes:
      - ./T1_back/plugins:/app/plugins
      - ./T1_back/data:/app/data
    environment:
      - PYTHONPATH=/app
    working_dir: /app
    restart: unless-stopped
    networks:
      - terraform-network
    command: python plugins/error_aggregator.py

  security-scanner:
    build: ./T1_back
    ports:
      - "50052:50052"
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./T1_back/plugins:/app/plugins
      - ./T1_back/data:/app/data
    working_dir: /app
    restart: unless-stopped
    networks:
      - terraform-network
    command: python plugins/security_scanner.py

  performance-analyzer:
    build: ./T1_back
    ports:
      - "50053:50053"
    volumes:
      - ./T1_back/plugins:/app/plugins
      - ./T1_back/data:/app/data
    environment:
      - PYTHONPATH=/app
    working_dir: /app
    restart: unless-stopped
    networks:
      - terraform-network
    command: python plugins/performance_analyzer.py
      
networks:
  terraform-network:
    driver: bridge

volumes:
  app_data: